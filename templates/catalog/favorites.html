{% extends "base.html" %}
{% block title %}Избранные события — КидсТайм{% endblock %}
{% block body_class %}page-favorites{% endblock %}
{% block content %}
    <div class="page-shell favorites-page">
        <nav class="breadcrumbs" aria-label="Хлебные крошки"><a href="{% url 'core:home' %}">Главная</a><span>→</span><span aria-current="page">Избранные события</span></nav>
        <header class="screen-header">
            <a class="round-button" href="{% url 'core:profile' %}" aria-label="В профиль">{% include "includes/icon.html" with name="arrow-left" %}</a>
            <h1>Избранные события</h1>
        </header>
        <div class="event-grid event-grid--results" data-device-favorites data-endpoint="{% url 'favorites:cards' %}" aria-live="polite"><div class="empty-state">Загружаем избранное…</div></div>
        <nav class="pagination collection-pagination" data-favorite-pages aria-label="Страницы избранного" hidden></nav>
        <template data-favorites-empty>
            <div class="empty-state favorites-empty">
                <h2>Сохраните то, что нравится</h2>
                <p>Нажмите на сердечко в карточке события, чтобы вернуться к нему позже.</p>
            </div>
        </template>
    </div>
{% endblock %}
