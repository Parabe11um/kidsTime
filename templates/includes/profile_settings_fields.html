{{ form.non_field_errors }}
<label><span class="sr-only">Имя</span>{{ form.first_name }}{{ form.first_name.errors }}</label>
<label><span class="sr-only">Фамилия</span>{{ form.last_name }}{{ form.last_name.errors }}</label>
{% if has_account %}
    <label><span class="sr-only">Отчество</span>{{ form.patronymic }}{{ form.patronymic.errors }}</label>
    <label class="profile-date-field"><span>Дата рождения</span>{{ form.birth_date }}{{ form.birth_date.errors }}</label>
{% endif %}
<div class="settings-email"><span class="sr-only">Email</span><p>{{ request.user.email|default:request.user.username }}</p></div>
{% if has_account %}
    <label><span class="sr-only">Телефон</span>{{ form.phone }}{{ form.phone.errors }}</label>
    <div class="profile-preferences">
        <h3>Рассылка</h3>
        <label class="choice-row profile-preferences__switch"><span>Получать письма с акциями</span>{{ form.newsletter }}</label>
    </div>
{% endif %}
