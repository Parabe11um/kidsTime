{% load static %}
<article class="weather-card"
         aria-label="Погода в Москве недоступна"
         title="Погодные данные пока не подключены">
    <img class="weather-card__icon" src="{% static 'icons/weather.svg' %}" width="40" height="43" alt="">
    <span class="weather-card__art" aria-hidden="true">
        <img class="weather-card__rain" src="{% static 'icons/release5/widget-weather.svg' %}" alt="">
        <img class="weather-card__fold" src="{% static 'icons/release5/widget-weather-fold.svg' %}" alt="">
    </span>
    <span class="weather-card__temperature" aria-hidden="true">—°</span>
    <span class="weather-card__label">Погода</span>
</article>
