name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Parser/runtime checks only; production uses the separately audited release image.
  CADDY_IMAGE: caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
  CADDY_TEST_BACKEND_IMAGE: python:3.12.15-slim-bookworm@sha256:34386ef0cb081344d7ec1c103ba398e6e9f64e9ab3a1509accc92a4e24a07258

jobs:
  caddy-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Load test images
        run: |
          docker pull "$CADDY_IMAGE"
          docker pull "$CADDY_TEST_BACKEND_IMAGE"
      - name: Check shared routes and access/error log privacy
        run: |
          python3 tests/check_caddy_security.py \
            --image "$CADDY_IMAGE" --backend-image "$CADDY_TEST_BACKEND_IMAGE"

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: kidstime
          POSTGRES_USER: kidstime
          POSTGRES_PASSWORD: kidstime
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kidstime -d kidstime"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: ci-only-secret-key
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgis://kidstime:kidstime@127.0.0.1:5432/kidstime
      REDIS_URL: redis://127.0.0.1:6379/0

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install GeoDjango system libraries
        run: sudo apt-get update && sudo apt-get install -y gdal-bin libgdal-dev libgeos-dev
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Install frontend dependencies
        run: npm ci
      - name: Validate Django project
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Validate production Compose configuration
        run: |
          cp .env.production.example .env.production
          docker compose \
            --env-file .env.production \
            -f compose.production.yaml \
            config --quiet
      - name: Run migrations and tests
        run: |
          python manage.py migrate --noinput
          python manage.py collectstatic --noinput
          python manage.py test
      - name: Verify compiled styles
        run: |
          npm run css:build
          git diff --exit-code -- static/css/app.css
